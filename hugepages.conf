# =============================================================================
# /etc/hugepages.conf
# hugepages-setup.sh 설정 파일
# =============================================================================

# ── Hugepage 크기 (kB) ────────────────────────────────────────────────────────
# 2048  = 2 MiB  (표준, 대부분의 환경)
# 1048576 = 1 GiB (1G hugepage, 커널 빌드 옵션 필요)
HP_SIZE_KB=2048

# ── 할당 개수 ─────────────────────────────────────────────────────────────────
# 0 이면 AUTO_RATIO 기반으로 자동 계산
# 예) KVM VM 에 4GiB 할당 예정이면 4096 MiB / 2 MiB = 2048
HP_COUNT=0

# ── 자동 계산 시 여유 메모리 점유 비율 (%) ────────────────────────────────────
# HP_COUNT=0 일 때만 사용됨
# 예) 32 GB 중 40% = 약 12 GB 를 hugepage 로 확보
AUTO_RATIO=40

# ── NUMA 노드 지정 ─────────────────────────────────────────────────────────────
# ""      = 시스템 전체 (단일 소켓 서버에 적합)
# "0"     = NUMA 노드 0 만
# "0,1"   = NUMA 노드 0, 1 에 균등 분배
NUMA_NODE=""

# ── hugetlbfs 마운트 경로 ─────────────────────────────────────────────────────
MOUNT_POINT="/dev/hugepages"

# ── libvirt 그룹 이름 ─────────────────────────────────────────────────────────
# Debian/Ubuntu 기본 : libvirt-qemu
# CentOS/RHEL 기본   : kvm
LIBVIRT_GROUP="libvirt-qemu"

# ── 마운트 퍼미션 ─────────────────────────────────────────────────────────────
# 1770 : sticky + rwxrwx--- (libvirt-qemu 그룹만 접근)
HUGETLBFS_MODE=1770

# ── 할당 재시도 ───────────────────────────────────────────────────────────────
RETRY_COUNT=3
RETRY_DELAY=2
